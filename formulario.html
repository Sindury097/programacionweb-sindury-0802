<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios en HTML</title>
</head>
<body>
    <div id="main-content">
        <h1> Implementacion de Objetos en HTML</h1>
        <h2>
            Permite la interconexi&oacute;n con el usuario, solicitando informaci&oacute;n
        </h2>
        <hr>
        <section class="form-tag">
            <form action="url" class="formulario">
            <fieldset>
                <legend> Formulario en html - Obtener datos</legend>
                <label for="">Nombre</label>
                <input type="text" id="name" name="nombre_usuario" required placeholder="Ejemplo: Arturo Lara Gomez" onkeyup="BuscarCliente (this.value)"> 
                <br>
                <br>
                <label for="clave">Contarse&ntilde;a</label>
                <input type="password" name="clave" id="clave" required> 
                <br>
                <br>
                <label for="edad">Edad</label>
                <input type="number" name="edad" id="edad" max="85" min="18" step="2" value="18">
                <br>
                <br>
                <label for="municipio">Municipio</label>
                <select id="municipio" required>
                    <option>Seleccione su municipio</option>
                    <option value="2">Jocotitl&aacute;n</option>
                    <option value="3">Ixtlahuaca</option>
                    <option value="4">Atlacomulco</option>
                    <option value="5" selected>Toluca</option>
                </select>
                <br> <br>

                <label for="">Habilidades</label>
                <select name="" id="habilidades">
                    <option value="0">Seleccione sus Habilidades</option>
                    <option value="1">Dise&ntilde;o</option>
                    <option value="2">Programacion</option>
                    <option value="3">Base de datos</option>
                </select>
                <br><br>

                <label for="correo">Correo</label>
                <input type="email" name="correo" id="correo" placeholder="usuario@dominio.ext" autofocus>
                <br><br>

                <label for="">Fecha de nacimiento</label>
                <input type="date" name="" id="nacimiento" min="2000-01-01" max="2002-01-01" value="2001/03/12">
                
                <br><br>
                Adjuntar Imagen <input type="file" name="" id="">
                
                <br><br>
                Indique su(s) deporte favorito: 
                Tenis <input type="checkbox" name="deportes" id="" value="1">
                Natacion <input type="checkbox", name="deportes" id="" value="2">
                Tiro con arco <input type="checkbox" name="deportes" id="" value="3">
                <br><br>

                Seleccione su genero: 
                Mujer <input type="radio" name="genero" id="" value="1">
                Hombre <input type="radio" name="genero" id="" value="2">
                <br><br>

                Mensaje <br>
                <textarea name="" id="" cols="30" rows="5"></textarea>
                <br><br>
                Seleccione un color <input type="color" name="" id="">
                <br><br>

                <input type="submit" value="Enviar"> 
                <input type="button" value="Cerrar" onclick="return ejemplo()">
                <input type="reset" value="Borrar datos del formulario"> 

            </fieldset>
            </form>
        </section>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
