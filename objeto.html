<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objetos en HTML</title>
</head>
<body>
    <div id="main-content">
        <h1> Implementacion de Objetos en HTML</h1>
        <h2>
            Son &uacute;tiles para implementar elementos externos
            como: Im&aacute;genes, videos, P&aacute;ginas en un archivo web
        </h2>
        <section class="object-tag">
            <object data="tabla.html" width="500" height="350"></object>
        </section>

        <br>
        <h2>Implementacion de video en HTML</h2>
        <section class="video-tag">
            <video src="Ruta" width="600" height="300" controls>
                <source src="Ruta" type="video/mp4">
                <source src="Ruta" type="video/webm">

                El navegador no permite el elemento para video
            </video>
        </section>
    </div>
</body>
</html>
